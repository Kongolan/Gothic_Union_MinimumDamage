name: Build Gothic Union Plugin
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: 1.11.1

    - name: Configure CMake
      # Wir zwingen den Compiler per CXX_FLAGS das Makro __G2A zu setzen!
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl -DCMAKE_CXX_FLAGS="/D__G2A"

    - name: Verify API Headers
      run: |
        echo "--- GOTHIC API TREE ---"
        find build/_deps/gothic_api-src -name "*.h"
        echo "--- UNION API TREE ---"
        find build/_deps/union_api-src -name "*.h"
      shell: bash

    - name: Build Plugin
      run: cmake --build build --config Release

    - name: Prepare Mod Release Folder
      run: |
        mkdir -p ModRelease/System/Autorun
        cp build/Union_MinimumDamage.dll ModRelease/System/Autorun/ || cp build/Release/Union_MinimumDamage.dll ModRelease/System/Autorun/
        cp src/Union_MinimumDamage_Menu.d ModRelease/System/Autorun/
      shell: bash

    - name: Build VDF (Gothic Volume)
      run: |
        tools\GothicVDFS.exe -b Union_MinimumDamage.vm
      shell: cmd

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Union_MinimumDamage_VDF
        path: Union_MinimumDamage.vdf