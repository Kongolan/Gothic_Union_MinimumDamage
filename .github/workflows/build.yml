name: Build Gothic Union Plugin
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x86

    - name: Setup Ninja
      uses: ashutoshvarma/setup-ninja@master
      with:
        version: 1.11.1

    - name: Configure CMake (Mit G2A Preset)
      # Nutzt das im Screenshot dokumentierte Windows-Preset für Gothic 2 Addon
      run: cmake --preset G2A-Release

    - name: Verify API Headers
      run: |
        echo "--- GOTHIC API TREE ---"
        find out/build/G2A-Release/_deps/gothic_api-src -name "*.h" || echo "Pfad abweichend"
        echo "--- UNION API TREE ---"
        find out/build/G2A-Release/_deps/union_api-src -name "*.h" || echo "Pfad abweichend"
      shell: bash

    - name: Build Plugin (Mit G2A Preset)
      run: cmake --build --preset G2A-Release

    - name: Prepare Mod Release Folder
      run: |
        mkdir -p ModRelease/System/Autorun
        # CMake Presets legen die kompilierte DLL standardmäßig im out/build/ Verzeichnis ab
        cp out/build/G2A-Release/Union_MinimumDamage.dll ModRelease/System/Autorun/ || cp build/Union_MinimumDamage.dll ModRelease/System/Autorun/ || cp build/Release/Union_MinimumDamage.dll ModRelease/System/Autorun/
        cp src/Union_MinimumDamage_Menu.d ModRelease/System/Autorun/
      shell: bash

    - name: Build VDF (Gothic Volume)
      run: |
        tools\GothicVDFS.exe -b Union_MinimumDamage.vm
      shell: cmd

    - name: Upload Mod Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Union_MinimumDamage_VDF
        path: Union_MinimumDamage.vdf